apiVersion: storage.example.io/v1beta1
kind: NodeDisk
metadata:
  name: hlvm-control-plane-sda
  labels:
    hlvm.storage/node: hlvm-control-plane
spec:
  nodeName: hlvm-control-plane
  device:
    path: /dev/sda
---
apiVersion: v1
kind: Pod
metadata:
  name: hlvm-agent-test
  # 与 agent_role.yaml 中 hlvm-agent SA 的命名空间保持一致（曾为 kube-system，
  # 导致该 Pod 的 serviceAccountName 解析不到）。
  namespace: hlvm-system
spec:
  serviceAccountName: hlvm-agent
  hostPID: true
  nodeName: hlvm-control-plane
  restartPolicy: Always
  containers:
  - name: agent
    image: hlvm-agent:test
    args: ["--mode=agent", "--node-name=hlvm-control-plane"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: dev
      mountPath: /dev
  volumes:
  - name: dev
    hostPath:
      path: /dev
