apiVersion: v1
kind: Namespace
metadata:
  name: hlvm-system
---
# 特权 Agent（读写）：唯一 PV/VG/pool 写路径（设计 §2 / §5.3）。
# 最小权限：仅必需 capability 与 hostPath；PSA restricted；seccomp RuntimeDefault。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hlvm-storage-agent
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: storage-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: storage-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: storage-agent
    spec:
      serviceAccountName: hlvm-storage-agent
      hostPID: true
      containers:
        - name: agent
          image: ghcr.io/f31/hlvm/storage-agent:latest
          args: ["--mode=agent"]
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SYS_ADMIN", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HLVM_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host
              mountPath: /host
            - name: dev
              mountPath: /dev
            - name: run-lock-lvm
              mountPath: /run/lock/lvm
      volumes:
        - name: host
          hostPath:
            path: /
        - name: dev
          hostPath:
            path: /dev
        - name: run-lock-lvm
          hostPath:
            path: /run/lock/lvm
---
# 非特权 exporter（只读，独立 DaemonSet，独立 SA，无 privileged，设计 §2 修正 v1.0）。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hlvm-storage-exporter
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: storage-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: storage-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: storage-exporter
    spec:
      serviceAccountName: hlvm-storage-exporter
      containers:
        - name: exporter
          image: ghcr.io/f31/hlvm/storage-agent:latest
          args: ["--mode=exporter"]
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
