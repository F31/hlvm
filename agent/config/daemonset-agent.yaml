apiVersion: v1
kind: Namespace
metadata:
  name: hlvm-system
---
# 特权 Agent（读写）：唯一 PV/VG/pool 写路径（设计 §2 / §5.3）。
#
# 注意：非特权 exporter **不在本文件**，其唯一来源是
# control-plane/config/exporter/daemonset.yaml（含端口、阈值 ConfigMap、反亲和）。
# 此前本文件另有一份简化副本（DaemonSet/hlvm-storage-exporter），两份同时 apply 会在
# 每个节点跑两个 exporter、重复抓取同一批指标，故已删除（2026-10-30）。
# 安全基线（设计 §11 安全）：收敛特权 —— 不再 privileged:true，改为精确 capability +
# drop ALL；readOnlyRootFilesystem；allowPrivilegeEscalation:false；seccomp RuntimeDefault。
# 命名空间级 PSA 在 hlvm-system 为 enforce=privileged（见 config/hardening/00-namespace-psa.yaml），
# 本 Pod 仍按以下最小化 securityContext 自约束。hostPID 保留用于宿主机进程/挂载发现。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hlvm-storage-agent
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: storage-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: storage-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: storage-agent
    spec:
      serviceAccountName: hlvm-agent
      hostPID: true
      containers:
        - name: agent
          image: ghcr.io/f31/hlvm/storage-agent:latest
          args: ["--mode=agent"]
          securityContext:
            # 收敛：去掉 privileged，仅放行 LVM 写路径必需的 capability。
            # SYS_ADMIN：挂载/设备/namespace 操作；DAC_OVERRIDE：读写设备节点；
            # SYS_RAWIO：部分块设备 IOCTL（sg_format/安全擦除）。如实测不需要 SYS_RAWIO 可移除。
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN", "DAC_OVERRIDE", "SYS_RAWIO"]
            seccompProfile:
              type: RuntimeDefault
          # 资源定稿（设计 §6.3 / M14c 6.3.1）：以下为占位值，须在 POC 实测后回填。
          # 依据 docs/poc/resource-profiles.md 的观测基线（CPU 峰值/常驻内存/RSS 上限）调整。
          # 收敛原则：agent 为唯一写路径，limit 留出 LVM 操作突发；exporter 只读，尽量小。
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HLVM_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host
              mountPath: /host
            - name: dev
              mountPath: /dev
            - name: run-lock-lvm
              mountPath: /run/lock/lvm
      volumes:
        - name: host
          hostPath:
            path: /
        - name: dev
          hostPath:
            path: /dev
        - name: run-lock-lvm
          hostPath:
            path: /run/lock/lvm
