[package]
name = "hlvm-agent"
version = "0.1.0"
edition = "2021"
description = "hlvm 节点 Agent：磁盘发现、SMART、预检、StorageTask 执行与上报（单一二进制，按 --mode 切换）"

# 设计 §5.1：单一二进制多模式（agent | exporter | doctor）。
[[bin]]
name = "hlvm-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util"] }
# kube-rs：StorageTask 状态回写（§3.4 单写者；Agent 仅写 status 子资源）。
# 显式开启 derive（CustomResource 宏）；其余默认特性（client/config/rustls-tls）保留。
kube = { version = "4", features = ["derive"] }
# CustomResource derive 生成 JsonSchema，需要 schemars 作为直接依赖（与 kube-derive 1.0 对齐）。
schemars = "1"
# k8s-openapi 由 kube 引入（Cargo.lock 解析为 0.28.0；CI 实证 0.28.0 含 v1_32、无 v1_31）。
# crates.io 当前最新为 0.29.0，它一次性聚合支持 k8s 1.33–1.37（含 v1_33..v1_37 多个版本特性），
# 详见 Arnavion/k8s-openapi v0.29.0 release（支持 v1.33.13/v1.34.13/v1.35.10/v1.36.6/v1.37.2）。
# 用户规划 Agent 适配 k8s 1.36 → 启用 v1_36 特性即可（无需升级 crate 版本）。
# build.rs 硬性要求启用至少一个 v1_* 特性（否则 panic），二进制 crate 须显式开一个（v1_36）。
# 升级 k8s-openapi 到 0.29 会连带要求 kube 在 ^4 内升级到依赖该版本的 4.x（cargo 自动解析）。
k8s-openapi = { version = "0.29", features = ["v1_36"] }

[dev-dependencies]
