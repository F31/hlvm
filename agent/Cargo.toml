[package]
name = "hlvm-agent"
version = "0.1.0"
edition = "2021"
description = "hlvm 节点 Agent：磁盘发现、SMART、预检、StorageTask 执行与上报（单一二进制，按 --mode 切换）"

# 设计 §5.1：单一二进制多模式（agent | exporter | doctor）。
[[bin]]
name = "hlvm-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util"] }
# kube-rs：StorageTask 状态回写（§3.4 单写者；Agent 仅写 status 子资源）。
# 显式开启 derive（CustomResource 宏）；其余默认特性（client/config/rustls-tls）保留。
kube = { version = "4", features = ["derive"] }
# CustomResource derive 生成 JsonSchema，需要 schemars 作为直接依赖（与 kube-derive 1.0 对齐）。
schemars = "1"
# k8s-openapi 由 kube 4.2.0 引入（Cargo.lock 解析为 0.28.0，对应 Kubernetes 1.31）。
# 该 crate 的 build.rs 硬性要求启用至少一个 v1_* 版本特性（否则 build script panic），
# 与代码是否引用 v1 类型无关——agent 是二进制 crate，须显式启用其支持的最高版本特性 v1_31。
# （v1_36 在 0.28.0 上不存在；0.28.0 最高支持到 v1_31。）
k8s-openapi = { version = "0.28", features = ["v1_31"] }

[dev-dependencies]
