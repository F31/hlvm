[package]
name = "hlvm-agent"
version = "0.1.0"
edition = "2021"
description = "hlvm 节点 Agent：磁盘发现、SMART、预检、StorageTask 执行与上报（单一二进制，按 --mode 切换）"

# 设计 §5.1：单一二进制多模式（agent | exporter | doctor）。
[[bin]]
name = "hlvm-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util"] }
# kube-rs：StorageTask 状态回写（§3.4 单写者；Agent 仅写 status 子资源）。
# 显式开启 derive（CustomResource 宏）；其余默认特性（client/config/rustls-tls）保留。
kube = { version = "4", features = ["derive"] }
# CustomResource derive 生成 JsonSchema，需要 schemars 作为直接依赖（与 kube-derive 1.0 对齐）。
schemars = "1"
# k8s-openapi 由 kube 引入（Cargo.lock 解析为 0.28.0，CI 实证其含 v1_32 特性、无 v1_31 → 0.28 对应 k8s 1.32）。
# 该 crate 的 build.rs 硬性要求启用至少一个 v1_* 版本特性（否则 build script panic），与代码是否引用
# v1 类型无关——agent 是二进制 crate，须显式启用一个。目标适配 k8s 1.36 → 需 v1_36 特性 →
# 须升级到含 v1_36 的 k8s-openapi 版本（0.32，按 0.28→1.32 推算 1.36=0.32）。
# 升级 k8s-openapi 会连带要求 kube 升级到依赖该版本的 4.x（cargo 在 ^4 范围内解析最新兼容者）。
k8s-openapi = { version = "0.32", features = ["v1_36"] }

[dev-dependencies]
