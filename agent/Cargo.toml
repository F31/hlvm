[package]
name = "hlvm-agent"
version = "0.1.0"
edition = "2021"
description = "hlvm 节点 Agent：磁盘发现、SMART、预检、StorageTask 执行与上报（单一二进制，按 --mode 切换）"

# 设计 §5.1：单一二进制多模式（agent | exporter | doctor）。
[[bin]]
name = "hlvm-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util"] }
# kube-rs：StorageTask 状态回写（§3.4 单写者；Agent 仅写 status 子资源）。
# 显式开启 derive（CustomResource 宏）；其余默认特性（client/config/rustls-tls）保留。
kube = { version = "4", features = ["derive"] }
# CustomResource derive 生成 JsonSchema，需要 schemars 作为直接依赖（与 kube-derive 1.0 对齐）。
schemars = "1"
# k8s-openapi 由 kube 4.2.0 引入，约束为 ^0.28（crates.io 当前 kube 最高 4.2.0，均绑定 0.28，
# 尚无任何 kube 版本依赖 0.29）。crates.io 确认 0.28.0 的 features 含 v1_32..v1_36（latest=v1_36），
# 即单个 0.28.0 crate 即支持 k8s 1.32–1.36——与 kube 4.0.0 起"用 0.28 支持 v1_36"的 CHANGELOG 一致。
# 用户规划 Agent 适配 k8s 1.36 → 启用 v1_36 特性（在 0.28.0 上已存在）。
# 不可用 0.29：0.29.0 虽支持 1.33–1.37（latest=v1_37，2026-10-28 新发布），但 kube 4.2.0 约束 ^0.28，
# 0.29 与之冲突会使 cargo 退回 0.28.0 且不启用 v1_36 → build.rs panic。故保持 0.28 + v1_36。
# build.rs 硬性要求启用至少一个 v1_* 特性（否则 panic），二进制 crate 须显式开一个（v1_36）。
k8s-openapi = { version = "0.28", features = ["v1_36"] }

[dev-dependencies]
