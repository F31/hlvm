name: CI

# 单仓多语言：control-plane 是 Go 模块，agent 是 Rust crate，二者构建完全独立。
# Go 与 Rust 各跑一条 job，互不依赖；仅在最后合并判定。
# 任意分支 push 与 PR 均触发（feature 分支推送即可触发 CI，无需先开 PR）。
# 推 v* tag（如 v0.1.0-preview.1）额外触发发布：镜像打版本标签 + 创建 GitHub Release。
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (control-plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    env:
      # 仓库根有 go.work，但仅引用单一模块 control-plane；CI 确定性关闭 workspace。
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      # 版本一致性门禁：VERSION / agent/Cargo.toml / tag 三者必须同一版本。
      # 不校验的话，镜像标签与二进制自述版本会悄悄分叉（Go 侧从 VERSION 注入、Rust 侧取自
      # Cargo 包版本），现场就无法判断跑的是哪个版本。放在 go job 最前——失败后 images job
      # 不会跑（needs: [go, rust]），坏标签推不出去。
      - name: Verify version consistency
        run: |
          root="${{ github.workspace }}"
          file_version="$(tr -d '[:space:]' < "${root}/VERSION")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' "${root}/agent/Cargo.toml" | head -1)"
          if [ "${file_version}" != "${cargo_version}" ]; then
            echo "::error::agent/Cargo.toml 版本（${cargo_version}）与 VERSION（${file_version}）不一致"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "${file_version}" != "${tag_version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 VERSION 文件（${file_version}）不一致；先改 VERSION 再打 tag"
              exit 1
            fi
          fi
          echo "版本一致性校验通过：${file_version}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod
          cache: true
          cache-dependency-path: control-plane/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # k8s 依赖代差基线：go.mod 的 k8s.io/* 与 controller-runtime 版本必须显式登记。
      # 当前组合存在已知代差（见 internal/version/deps_test.go 顶部注释），本步骤不负责
      # "统一版本"，只挡住 go get -u / 手工改版本造成的静默漂移。go test ./... 已包含它，
      # 单独列出是为了让 CI 日志里能一眼看到版本门禁的名字与失败原因。
      - name: Verify k8s dependency baseline
        run: go test ./internal/version -run TestK8sDependency -count=1 -v
      # envtest 用真实 kube-apiserver + etcd 验证控制器（CRD schema、status 写回、controller 注册）。
      # 此前只在本地跑，导致「多个 envtest 同进程注册同名 controller」这类问题无法在 CI 暴露；
      # 版本与目标集群对齐（ENVTEST_K8S_VERSION，见 Makefile）。
      - name: Install envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Test (envtest)
        run: make test-envtest

  rust:
    name: Rust (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      # 版本可追溯：把短 SHA 编译进 hlvm-agent（启动日志打印），便于 kubectl logs 定位构建。
      - name: Export build metadata
        run: echo "HLVM_GIT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # rustfmt + clippy 作为质量门；ubuntu runner 自带 gcc，解决本机开发箱无链接器无法编译的问题。
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      # 先编译+测试（最关键）：本机 Windows 开发箱无链接器无法编译，这里才是真实门禁。
      # 已知已修复项（首跑已暴露并据实修正）：
      #   * k8s-openapi build.rs 硬性要求启用 v1_* 特性。crates.io 确认 0.28.0 的 features 已含
      #     v1_32..v1_36（latest=v1_36）——单个 0.28.0 crate 即支持 k8s 1.32–1.36（与 kube 4.0.0
      #     "用 0.28 支持 v1_36" 一致）。用户规划适配 1.36 → 启用 v1_36 特性即可。
      #     不可用 0.29：0.29.0 虽支持 1.33–1.37，但 kube 4.2.0 约束 ^0.28，0.29 与之冲突会使
      #     cargo 退回 0.28.0 且不启用 v1_36 → build panic。故定 0.28 + v1_36。
      #     注：Agent(k8s 1.36) 与控制面 Go operator(client-go 1.33) 差 3 小版本，编译互不影响。
      #   * tokio 特性 `io` 不存在（应为 `io-util`）→ 修正
      # 仍可能暴露 M14 代码的真实编译/单测问题，按报错据实修。
      - name: Test (compile + unit tests)
        run: cargo test --all-targets
      # fmt / clippy 作为质量反馈，但非硬门禁：提交代码未用 rustfmt 格式化，
      # 且 clippy -D warnings 过于严格，避免阻塞真正的编译/测试信号。后续用 rustfmt 收敛。
      - name: Format check
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release
      # agent 镜像的唯一来源：先产出二进制，再由 images job 打包（agent/Dockerfile 只做 COPY）。
      # 此前 CI 只构建 control-plane 两镜像，清单引用的 storage-agent 从未被构建/推送，
      # 真实集群部署 agent 必然 ImagePullBackOff；本地又因无 Rust 链接器无法补建。
      - name: Upload agent binary for image build
        uses: actions/upload-artifact@v4
        with:
          name: hlvm-agent-bin
          path: agent/target/release/hlvm-agent
          if-no-files-found: error
          retention-days: 3

  # 告警/记录规则的真实求值（ADR-006 §18）：用 promtool 解析全部 PrometheusRule，
  # 并按时间推进求值三方对账告警。go job 里的 TestAlertRulesReferenceKnownMetrics 只能
  # 证明「引用的指标名存在」，证明不了表达式可解析、`for:` 会在预期时刻触发、健康态不误报。
  # 规则写错时 Prometheus 静默不触发，与「一切正常」不可区分 —— 所以必须有引擎级门禁。
  prometheus-rules:
    name: Prometheus rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and evaluate rules
        run: scripts/prometheus-rules-check.sh

  # 容器镜像构建/推送（M15 门槛 1.4：control-plane 需可构建镜像以部署 webhook）。
  # 使用 control-plane/Dockerfile（多阶段、参数化 CMD_NAME）与 agent/Dockerfile（COPY 预编译二进制）。
  # 推送时机：main 分支 push 与 v* tag push 均推送；PR 仅构建校验 Dockerfile，不推送（避免污染 registry）。
  # 标签策略：tag push → :vX.Y.Z + :latest；main push → :sha-<short> + :latest。版本三元组注入二进制。
  # 注意 GHCR 包为私有：集群侧须注入 imagePullSecret（见 docs/m15-integration-runbook.md §6）。
  images:
    name: Container images (control-plane + agent)
    needs: [go, rust]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag'))
      || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # agent/Dockerfile 只做 COPY hlvm-agent，二进制由 rust job 产出。
      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: hlvm-agent-bin
          path: agent
      # 版本三元组一次算好，四个镜像共用。非 tag 构建用 sha-<short>，
      # 避免分支构建也往 :latest 之外的固定版本号上叠。
      - name: Compute build metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push storage-controller
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/Dockerfile
          build-args: |
            CMD_NAME=storage-controller
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: |
            ghcr.io/f31/hlvm/storage-controller:${{ steps.meta.outputs.version }}
            ghcr.io/f31/hlvm/storage-controller:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push storage-webhook
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/Dockerfile
          build-args: |
            CMD_NAME=storage-webhook
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: |
            ghcr.io/f31/hlvm/storage-webhook:${{ steps.meta.outputs.version }}
            ghcr.io/f31/hlvm/storage-webhook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # CRD 多版本 conversion webhook（config/hardening/03-crd-conversion.yaml 引用）。
      # 此前该清单引用的镜像从未被构建：apply 后 apiserver 调用转换只会拿到 404，
      # 而 CRD 一旦配置 conversion 就以它为读路径 → 整组 NodeDisk 不可用。
      - name: Build & push crd-conversion
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/Dockerfile
          build-args: |
            CMD_NAME=crd-conversion
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: |
            ghcr.io/f31/hlvm/crd-conversion:${{ steps.meta.outputs.version }}
            ghcr.io/f31/hlvm/crd-conversion:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push storage-agent
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          # 基础层为 kindest/node（含 nsenter/blkid/lsblk），体积约 1GB，命中 gha 缓存可复用。
          # 版本号已在 rust job 编译进二进制（Cargo 包版本 + HLVM_GIT_COMMIT），无需 build-arg。
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          tags: |
            ghcr.io/f31/hlvm/storage-agent:${{ steps.meta.outputs.version }}
            ghcr.io/f31/hlvm/storage-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 发布：仅在 v* tag 上创建 GitHub Release，正文取 docs/release-notes/<tag>.md。
  # 缺发布说明直接失败——发布必须带「范围与限制声明」，不允许只有版本号的无说明发布。
  # 预发布标记按版本串是否含 `-` 自动判定（v0.1.0-preview.1 → prerelease）。
  release:
    name: GitHub Release
    needs: [go, rust, images]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes}" ]; then
            echo "::error::缺少发布说明 ${notes}；发布必须附范围与限制声明"
            exit 1
          fi
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            "${flags[@]}"

  # 汇总门禁。`if: always()` 保证即使上游失败也会跑，但**必须自己断言结果**：
  # 之前这一步只 echo 一行，于是 go/rust 失败时 Ready 依旧绿——分支保护看的就是这个
  # job，等于把整条门禁废掉（2026-11-12 CI 首跑实测：两个 job failure、Ready success）。
  # 例外：images 在非 main/tag 的 PR 上可能被 if 条件跳过，skipped 不算失败。
  ready:
    name: Ready
    if: always()
    needs: [go, rust, images, prometheus-rules]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总并断言各门禁结果
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "CI 门禁汇总（go + rust + images + prometheus-rules）"
          echo "${NEEDS}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # 允许 skipped 的只有 images（PR 上按条件跳过属预期）。
          failed="$(echo "${NEEDS}" | jq -r '
            to_entries[]
            | select(.key != "images" or .value.result != "skipped")
            | select(.value.result != "success")
            | "\(.key)=\(.value.result)"' | paste -sd, -)"
          if [ -n "${failed}" ]; then
            echo "::error::门禁未通过：${failed}"
            exit 1
          fi
          echo "全部门禁通过"
