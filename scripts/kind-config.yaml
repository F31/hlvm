# hlvm M15 多节点 kind 集群配置（1 control-plane + 2 workers）。
#
# 接入方式：m15-integration.sh 的 `kind create cluster` 已加 `--config` 指向本文件
# （见脚本变量 KIND_CONFIG）。bootstrap 保留「集群已存在则复用」逻辑，因此现有的
# 单节点 hlvm-kind 集群不会被自动重建——本配置只在下次从零创建集群时生效。
#
# 要切到多节点拓扑（用于 6.5b 调度器拓扑/扩缩容的本地预演），需先：
#   kind delete cluster --name hlvm-kind
#   MSYS_NO_PATHCONV=1 wsl.exe -d Ubuntu24.04LTS -- bash /mnt/e/projects/hlvm/scripts/m15-wsl.sh bootstrap
# 之后全量 `all` 会在多节点上重新验证（agent DaemonSet / device-plugin 会在各节点铺开）。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
