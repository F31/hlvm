apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlvm-storage-webhook
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: storage-webhook
spec:
  # 设计 §4：独立 webhook，active-active、无 leader election（无状态、只读 NodeVG status）。
  # 三副本 + PDB（见 poddisruptionbudget.yaml）保证高可用；webhook 不可用不阻塞集群（容量类 FailurePolicy=Ignore）。
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: storage-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: storage-webhook
    spec:
      serviceAccountName: hlvm-storage-webhook
      # 拓扑分散（替代原先的 preferred 反亲和）：preferred 只是打分项，与资源均衡/镜像本地性等
      # 其它打分竞争，无法表达「副本间差异不超过 N」；topologySpreadConstraints 由调度器按当前
      # 节点集合显式计算 skew。ScheduleAnyway 为软约束：可用域不足时允许堆叠，不产生 Pending
      # （3 副本 + 2 个可调度节点必然是 2:1，这是数学结果，不是配置缺陷）。
      # 有效域 D = 可调度节点数（control-plane 带 NoSchedule taint 且本 Deployment 未容忍 ⇒ 不计入）。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hlvm
              app.kubernetes.io/component: storage-webhook
      containers:
        - name: webhook
          image: ghcr.io/f31/hlvm/storage-webhook:latest
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --webhook-port=9443
            - --cert-dir=/tmp/k8s-webhook-server/serving-certs
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: serving-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: serving-certs
          secret:
            # 由 cert-manager 注入（见 certificate.yaml）；未启用 cert-manager 时手动创建同名 secret。
            secretName: hlvm-storage-webhook-serving-cert
            defaultMode: 420
