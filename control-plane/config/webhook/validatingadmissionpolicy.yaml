# 静态规则 ValidatingAdmissionPolicy（设计 §4 第 3 层）：不需要自研 webhook，由 API Server 原生执行。
# 要求 K8s ≥ 1.30（VAP GA）。
---
# SC 白名单 / reclaimPolicy 校验：本平台 StorageClass（provisioner=topolvm.io）必须声明 device-class 且 reclaimPolicy 合法。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hlvm-storageclass-policy
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["storageclasses"]
  validations:
    - expression: "object.provisioner != 'topolvm.io' || (has(object.parameters) && 'topolvm.io/device-class' in object.parameters)"
      message: "本平台 StorageClass（provisioner=topolvm.io）必须声明 topolvm.io/device-class 参数（设计 §6）"
    - expression: "object.provisioner != 'topolvm.io' || (object.reclaimPolicy in ['Retain','Delete'])"
      message: "本平台 StorageClass 的 reclaimPolicy 必须为 Retain 或 Delete"
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hlvm-storageclass-policy-binding
spec:
  policyName: hlvm-storageclass-policy
  # K8s 1.34+ 强制 binding 显式声明 validationActions（1.33 可省略、默认 Deny）。
  validationActions:
    - Deny
  matchResources: {}
---
# replicas 声明标签：仅格式校验，failurePolicy=Ignore（只提示不强拦，§2.3）。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hlvm-pvc-replicas-policy
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  validations:
    - expression: |
        !('storage.example.io/replicas' in object.metadata.annotations) ||
        object.metadata.annotations['storage.example.io/replicas'].matches('^[1-3]$')
      message: "replicas 声明（storage.example.io/replicas）若设置应为 1-3 的整数；本地多副本尚未实现，仅提示不强拦"
  failurePolicy: Ignore
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hlvm-pvc-replicas-policy-binding
spec:
  policyName: hlvm-pvc-replicas-policy
  # 仅提示不强拦：Warn 配合 failurePolicy=Ignore（webhook 不可用时也不阻塞集群）。
  validationActions:
    - Warn
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "hlvm-system"]
