# 单版本 v1beta1（served + storage）。与 nodedisks/nodevgs 基线一致：bootstrap 阶段只提供存储版本，
# conversion webhook 尚未就绪，控制器直接读写 v1beta1，不经 webhook。
# 双版本（v1beta1=storage + v1alpha1=served 兼容层）由 config/hardening/03f-thinpoolpolicy-dual-version.yaml
# 在 conversion webhook 就绪后叠加。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: thinpoolpolicies.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: ThinPoolPolicy
    listKind: ThinPoolPolicyList
    plural: thinpoolpolicies
    singular: thinpoolpolicy
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                thresholds:
                  type: object
                  properties:
                    autoExtendPercent: { type: integer, minimum: 0, maximum: 100 }
                    autoExtendStepPercent: { type: integer, minimum: 0, maximum: 100 }
                    warningPercent: { type: integer, minimum: 0, maximum: 100 }
                    criticalPercent: { type: integer, minimum: 0, maximum: 100 }
                    unlockPercent: { type: integer, minimum: 0, maximum: 100 }
                    metadataWarningPercent: { type: integer, minimum: 0, maximum: 100 }
                    metadataCriticalPercent: { type: integer, minimum: 0, maximum: 100 }
                forecast:
                  type: object
                  properties:
                    timeToFullWarning: { type: string }
                    timeToFullCritical: { type: string }
                lock:
                  type: object
                  properties:
                    blockNewPVC: { type: boolean }
                    blockPVCExpansion: { type: boolean }
                requireFreeVGSpace: { type: string }
                alertChannels:
                  type: array
                  items: { type: string }
                tierOverrides:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                    autoExtendPercent: { type: integer, minimum: 0, maximum: 100 }
                    autoExtendStepPercent: { type: integer, minimum: 0, maximum: 100 }
                    warningPercent: { type: integer, minimum: 0, maximum: 100 }
                    criticalPercent: { type: integer, minimum: 0, maximum: 100 }
                    unlockPercent: { type: integer, minimum: 0, maximum: 100 }
                    metadataWarningPercent: { type: integer, minimum: 0, maximum: 100 }
                    metadataCriticalPercent: { type: integer, minimum: 0, maximum: 100 }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
