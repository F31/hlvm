apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodedisks.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: NodeDisk
    listKind: NodeDiskList
    plural: nodedisks
    singular: nodedisk
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [nodeName]
              properties:
                nodeName: { type: string }
                deviceRef: { type: string }
                adopt: { type: boolean }
                confirmSerial: { type: string }
                wipePolicy:
                  type: string
                  enum: [none, zero, secure-erase]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
