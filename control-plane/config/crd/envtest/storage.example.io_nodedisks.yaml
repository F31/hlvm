# envtest 专用 NodeDisk CRD：单版本 v1beta1（served + storage，无 conversion webhook）。
#
# 为什么单独一份：envtest 启动的是真实 kube-apiserver，但没有 conversion webhook 服务。
# 生产「完整收敛」目标形态（03b-nodedisk-dual-version.yaml）是双版本 v1beta1=storage +
# v1alpha1=served + conversion webhook，直接喂给 envtest 会因 v1alpha1 served 而要求 webhook
#（不可用 ⇒ 跨版本读写失败）。envtest 只验证控制器对账逻辑，用单版本 v1beta1 即可覆盖，
# 且与「控制器走 v1beta1 存储版本」的生产语义一致。其余 4 个 Kind 仍只有 v1alpha1，共用本目录。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodedisks.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: NodeDisk
    listKind: NodeDiskList
    plural: nodedisks
    singular: nodedisk
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Device
          type: string
          jsonPath: .spec.device.path
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [nodeName]
              properties:
                nodeName: { type: string }
                device:
                  type: object
                  properties:
                    path: { type: string, maxLength: 256 }
                adopt: { type: boolean }
                confirmSerial: { type: string, maxLength: 128 }
                wipePolicy:
                  type: string
                  enum: [none, zero, secure-erase]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
