# 单版本 v1beta1（served + storage）。与 nodedisks 基线一致：bootstrap 阶段只提供存储版本，
# conversion webhook 尚未就绪，控制器/dashboard/agent 直接读写 v1beta1，不经 webhook。
# envtest 用独立目录（真实 apiserver 但无 conversion 服务），与 config/crd/bases 保持同步。
# 双版本（v1beta1=storage + v1alpha1=served 兼容层）由 config/hardening/03c-nodevg-dual-version.yaml
# 在 conversion webhook 就绪后叠加。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodevgs.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: NodeVG
    listKind: NodeVGList
    plural: nodevgs
    singular: nodevg
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: CapacityStatus
          type: string
          jsonPath: .status.capacityStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [nodeName]
              properties:
                nodeName: { type: string }
                tier: { type: string }
                deviceClassName: { type: string }
                layout:
                  type: string
                  enum: [pooled, per-disk]
                redundancy:
                  type: string
                  enum: [none, hw-raid, md-raid1, lvm-raid1]
                disks:
                  type: array
                  items: { type: string }
                thinPool:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    initialSizePercent: { type: integer }
                    maxSizePercent: { type: integer }
                    metadataSize: { type: string }
                    chunkSize: { type: string }
                    overprovisionRatio: { type: number }
                operations:
                  type: object
                  properties:
                    removeDisks:
                      type: array
                      items: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
