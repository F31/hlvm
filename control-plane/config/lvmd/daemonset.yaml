# lvmd DaemonSet —— B 链路供给的节点级 lvmd 消费者（ADR-006 §3 / 路线 A / §13 多节点）。
#
# 机制（TopoLVM v0.42.0 实测源码 internal/lvmd/command/lvm_command.go）：
#   lvmd 默认把 lvm 命令封装为 `nsenter -m -u -i -n -p -t 1 /sbin/lvm ...`，
#   即进入**宿主 PID 1 的命名空间**执行宿主 /sbin/lvm。因此：
#     - 必须 hostPID: true（否则 -t 1 指向容器自身）
#     - 必须 privileged（nsenter + 设备访问）
#     - lvm 自动使用宿主 /run/lock/lvm 锁 + 宿主 IPC NS 的 udev 信号量；
#       agent 须用同一套 `nsenter -t 1 -m -u -i -n -p --`（§5.3 / ADR-006 §11）
#       才**天然同源同锁**，满足并发互斥门禁（host-wrapper-gate.sh 真实写验证）。
#       注意 `chroot /host` 不切 IPC NS，写路径会挂死，不可作为等价替代。
#   注意：hlvm agent 的 `HLVM_HOST_WRAPPER` 是 agent 私有 env，lvmd 不识别，切勿照抄。
#
# 配置来源与「按节点投影」（ADR-006 §13）：
#   真相源是控制面 LvmdConfigReconciler 渲染的 per-node ConfigMap `hlmd-lvmd-<node>`
#   （ADR-005：device-class ↔ volume-group=NodeVG.name ↔ thin-pool）。两节点 VG 名不同，
#   故配置内容不同；而 K8s 的 ConfigMap 卷名是静态的，一个 DaemonSet 无法按节点动态选卷。
#   解法：把各节点配置汇总进 `hlvm-lvmd-all`（key = 节点名），挂到 /etc/topolvm-all，
#   由 initContainer 用 Downward API 的 NODE_NAME 拷对应 key 到 emptyDir /etc/topolvm/lvmd.yaml。
#   于是 DS 只有一个，节点扩缩 = 打标签 + 同步聚合 CM，不再改清单。
#   聚合 CM 由 docs/poc/scripts/expand-lvmd-nodes.sh 从 per-node CM 生成并逐字节核对；
#   生产化应由控制器直接渲染聚合 CM（§13.5 诚实边界）。
#
# 节点选择：`hlvm.io/lvmd=true` 标签由扩容脚本打在**确已建好 VG** 的 worker 上，
#   避免把 lvmd 调到没有配置的节点后 initContainer 取不到 key 而 CrashLoop。
#
# lvmd 不访问 K8s API（只读本地挂载的 lvmd.yaml），故本清单不含 RBAC 规则，仅建独立 SA。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hlvm-lvmd
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm-lvmd
    app.kubernetes.io/component: lvmd
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hlvm-lvmd
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm-lvmd
    app.kubernetes.io/component: lvmd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm-lvmd
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm-lvmd
        app.kubernetes.io/component: lvmd
    spec:
      serviceAccountName: hlvm-lvmd
      # nsenter -t 1 必须能命中宿主 init。
      hostPID: true
      nodeSelector:
        hlvm.io/lvmd: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        # 用 CSI node 同款镜像（内含 sh，真机已缓存/随扩容拉取），不引入第三种镜像。
        - name: project-node-config
          image: ghcr.io/topolvm/topolvm-with-sidecar:0.42.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              src="/etc/topolvm-all/${NODE_NAME}"
              if [ ! -f "${src}" ]; then
                echo "no lvmd config for node ${NODE_NAME}; keys:" >&2
                ls -1 /etc/topolvm-all >&2
                exit 1
              fi
              cp "${src}" /etc/topolvm/lvmd.yaml
              grep -q 'volume-group' /etc/topolvm/lvmd.yaml
              echo "lvmd config projected for ${NODE_NAME}:"
              cat /etc/topolvm/lvmd.yaml
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts:
            - {name: lvmd-config-all, mountPath: /etc/topolvm-all, readOnly: true}
            - {name: lvmd-config, mountPath: /etc/topolvm}
      containers:
        - name: lvmd
          # POC 只需 lvmd，故用 plain `topolvm` 镜像（amd64 层共 73.3 MiB）；
          # `topolvm-with-sidecar`（210.1 MiB）多出来的层是 CSI sidecar 二进制，
          # lvmd 用不到，真机弱网下拉取代价约 3 倍。生产若同镜像复用 CSI 再换回。
          image: ghcr.io/topolvm/topolvm:0.42.0
          imagePullPolicy: IfNotPresent
          command: ["/lvmd"]
          args:
            - --config=/etc/topolvm/lvmd.yaml
          securityContext:
            # 与上游 chart 默认一致：nsenter + 设备访问必需。
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            seccompProfile:
              type: Unconfined
          livenessProbe:
            exec:
              command: ["/lvmd", "health"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: dev
              mountPath: /dev
            # 由 initContainer 从聚合 CM 按 NODE_NAME 投影出来的 lvmd.yaml。
            - name: lvmd-config
              mountPath: /etc/topolvm
              readOnly: true
            # gRPC unix socket 目录（默认 /run/topolvm/lvmd.sock）。
            - name: lvmd-socket-dir
              mountPath: /run/topolvm
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: lvmd-config
          emptyDir: {}
        - name: lvmd-config-all
          configMap:
            name: hlvm-lvmd-all
        - name: lvmd-socket-dir
          hostPath:
            path: /run/topolvm
            type: DirectoryOrCreate
