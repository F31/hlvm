# 控制面 LvmdConfigReconciler 对第二节点的渲染结果快照。
# 一致性由 TestLvmdPOCArtifactsConsistent 锁定：data["lvmd.yaml"] 必须等于
# AggregateLVMDConfig(nodevg-seed-202.yaml)。部署后控制器会接管并补 ownerReference。
apiVersion: v1
kind: ConfigMap
metadata:
  name: hlmd-lvmd-10-60-166-202
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm-lvmd
    app.kubernetes.io/component: lvmd
  annotations:
    hlvm.dev/managed: "true"
data:
  lvmd.yaml: |
    # hlvm lvmd config (aggregated from NodeVGs on this node)
    device-classes:
      - name: hlvm-lvmd
        volume-group: hlvm-lvmd-vg-202
        spare-gb: 0
        thin-pool:
          name: thinpool
          overprovision-ratio: 1.00
