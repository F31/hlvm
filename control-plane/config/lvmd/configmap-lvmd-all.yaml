# lvmd 聚合配置 —— 一份 ConfigMap 承载全部节点的 lvmd.yaml，key = 节点名。
#
# 为什么需要它：Kubernetes 的 ConfigMap 卷名是**静态**的，一个 DaemonSet 无法按
# spec.nodeName 动态选择 `hlmd-lvmd-<node>`。故 lvmd DS 挂本 CM 到 /etc/topolvm-all，
# 由 initContainer 用 Downward API 的 NODE_NAME 拷贝对应 key 到 emptyDir 的
# /etc/topolvm/lvmd.yaml，再交给主容器。这样 DS 只有一个，节点扩缩只需改标签 + 本 CM。
#
# 真相源仍是控制面渲染的 per-node ConfigMap；本文件是二者内容的**聚合投影快照**。
# expand-lvmd-nodes.sh 会从集群里的 per-node CM 重新生成并 apply，同时逐字节核对，
# 防止控制器纠正漂移后本 CM 落后。生产化应由控制器直接渲染聚合 CM（ADR-006 §13.5）。
#
# key 用节点名（含连字符）是合法的 ConfigMap data key，挂载后即文件名。
apiVersion: v1
kind: ConfigMap
metadata:
  name: hlvm-lvmd-all
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm-lvmd
    app.kubernetes.io/component: lvmd-config
  annotations:
    hlvm.dev/managed: "false"   # POC 手工同步；控制器目前只写 per-node CM
data:
  10-60-153-100: |
    # hlvm lvmd config (aggregated from NodeVGs on this node)
    device-classes:
      - name: hlvm-lvmd
        volume-group: hlvm-lvmd-vg-153
        spare-gb: 0
        type: thin
        thin-pool:
          name: thinpool
          overprovision-ratio: 1.00
  10-60-166-202: |
    # hlvm lvmd config (aggregated from NodeVGs on this node)
    device-classes:
      - name: hlvm-lvmd
        volume-group: hlvm-lvmd-vg-202
        spare-gb: 0
        type: thin
        thin-pool:
          name: thinpool
          overprovision-ratio: 1.00
