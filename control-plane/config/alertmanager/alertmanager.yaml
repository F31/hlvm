# hlvm Alertmanager 配置：通知路由 + 抑制规则（ADR-006 §20）。
#
# 解决的问题：规则文件（config/prometheus/*.yaml）只决定「什么时候算告警」，
# 决定不了「谁会收到、会不会被同源噪声淹掉」。此前仓库里没有任何 Alertmanager 配置，
# 于是 §17–§19 那套告警在真实部署里根本没有落点：
#   - 没有路由 ⇒ 全部落到默认接收器（或直接静默丢弃）；
#   - 没有抑制 ⇒ thin-pool 进 out-of-space 时 DataWarning/Critical 与 metadata 告警
#     同时响四五条，值班人要先做故障分类才能开始处理；
#   - 抑制规则写错（alertname 拼错）**不会报错**，表现为「告警变少了」——
#     和「一切正常」不可区分，与本 ADR 反复要治的是同一种病。
#
# 校验：`scripts/observability-config-check.sh`（amtool check-config + 语义守卫），
# 已进 CI 的 observability job；`alertmanager_config_test.go` 守「抑制规则引用的告警都存在」
# 「每条 severity 都有路由接收」这类只有我们自己知道的语义。
#
# 部署形态：本文件是 Prometheus-Operator 之外的独立 Alertmanager 配置（Secret
# alertmanager-config 的 alertmanager.yaml 键）。接收器地址是**形状示例**，部署时替换。
---
global:
  # 与 Prometheus 抓取/求值周期（15s/1m）对齐：resolve_timeout 过短会让
  # for: 抖动的告警反复 resolved→firing，过长则故障恢复期间通知一直挂着。
  resolve_timeout: 5m

route:
  # 默认接收器用黑洞：**未匹配任何路由的告警不静默丢弃**，而是留在 Alertmanager UI
  # 与 /api/v2/alerts 里可查（无 configs 的 receiver 仍会记录告警，只是不投递）。
  # 配合「每条 severity 都必须有路由」的守卫：新增 severity 忘记接线会在 CI 里红。
  receiver: blackhole
  group_by: [alertname, node, vg]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 顺序敏感：Alertmanager 只走**第一条匹配**的叶子路由（除非该路由 continue: true），
    # 因此 critical 必须排在 warning 之前，否则 critical 会被 warning 路由吃掉。
    - matchers: ['severity="critical"']
      receiver: pager
      # Critical 延迟目标 ≤1min（设计 §11）：10s 聚合 + 抓取/求值间隔。
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: ticket
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h

receivers:
  # 无 configs = 只记录不投递（默认兜底，见 route.receiver）。
  - name: blackhole

  - name: pager
    webhook_configs:
      # 形状示例：指向值班系统适配器。send_resolved 必开——Critical 静默恢复却不通知，
      # 值班人无法判断是「已恢复」还是「通知链路又坏了」。
      - url: http://hlvm-alert-sink.hlvm-system.svc:9095/v1/alerts/critical
        send_resolved: true
        max_alerts: 0

  - name: ticket
    webhook_configs:
      - url: http://hlvm-alert-sink.hlvm-system.svc:9095/v1/alerts/warning
        send_resolved: true

# 抑制规则（inhibit_rules）
#
# 判据：**抑制只用于「同一根因的派生信号」，绝不跨子系统压制。**
# 跨子系统抑制（例如「任意 critical 压同节点所有 warning」）看着省事，实际会把
# StorageDriftDetected 这类「必须由人补录/回滚」的告警压掉，而它需要的处置与容量告警
# 完全不同——噪声是少了，漏报却不会被发现。
#
# 写法约束：alertname 只用「字面量」或「字面量的 | 分支」，**不要写 `(A|B)` 这类分组正则**。
# 原因不是语法洁癖：正则里的名字没法静态展开成告警名集合，于是「抑制规则引用了一个
# 已被改名的告警」这种错误只能靠人眼发现（而它不报错、只是安静地不再抑制任何东西）。
# alertmanager_config_test.go 会在遇到不可展开的写法时直接失败。
#
# `equal` 里的标签必须**同时存在于 source 与 target**，否则该条抑制永不生效（不报错）；
# 这也是 alertmanager_config_test.go 要守的语义之一。
inhibit_rules:
  # 1) 同一 thin-pool 的 Critical 压掉同指标的 Warning：两者共用一条表达式族，
  #    Critical 已经包含 Warning 的全部信息（阈值更高）。
  - source_matchers: ['alertname=~"ThinPoolDataCritical|ThinPoolMetadataCritical"']
    target_matchers: ['alertname=~"ThinPoolDataWarning|ThinPoolMetadataWarning"']
    equal: [node, vg]

  # 2) thin-pool 进入 out-of-space / needs_check 之后，容量百分比是同一故障的派生量，
  #    此时「使用率 85%」不再有操作意义（处置动作已变成 Runbook §9.1）。
  - source_matchers: ['alertname="ThinPoolOutOfSpace"']
    target_matchers:
      - 'alertname=~"ThinPoolDataWarning|ThinPoolDataCritical|ThinPoolMetadataWarning|ThinPoolMetadataCritical"'
    equal: [node, vg]

  # 3) SMART 已判死（Critical/Failed）：同一块盘的温度 / 寿命 / spare / media 增量
  #    都是它的派生信号，处置动作统一为「标记盘并换盘」。
  - source_matchers: ['alertname="DiskSmartCritical"']
    target_matchers:
      - 'alertname=~"DiskAvailableSpareLow|DiskMediaErrorsCritical|DiskTemperatureWarning|DiskLifeWarning"'
    equal: [node, device]

  # 刻意**不加**的抑制（写成注释防止后人「顺手补上」）：
  #   - 任意 critical ⇒ 同节点所有 warning：会压掉 StorageDriftDetected / DriftLVReportStalled，
  #     而这两条恰恰是「平台看起来一切正常」时唯一能暴露问题的信号。
  #   - DriftLVReportStalled ⇒ DriftReconcileSkipped：后者的 reason 是闭集，
  #     no_reporter（lvs 一侧从未接入，属配置缺失）与 list_failed（RBAC/API 故障）
  #     都不能被 report_stale 掩掉，否则同一节点上两个独立故障只剩一个可见。
  #   - AgentHeartbeatLost ⇒ 任意存储告警：心跳丢失时数据面不受影响，容量与磁盘告警仍然有效。
