# NodeVG「完整收敛」目标形态：**双版本 CRD（v1beta1=storage，v1alpha1=served 兼容层）
# + conversion webhook 接线**。
#
# 单独成文件的原因：它必须**在** 03-crd-conversion.yaml 的 Deployment 就绪**之后**才能 apply。
# 提前 apply 会造成「CRD 已要求转换、webhook 还不存在」的窗口，期间所有**跨版本** NodeVG
# 读写失败（老客户端 v1alpha1 的读写尤其依赖 webhook）。
#
#   1) kubectl apply -f config/hardening/03-crd-conversion.yaml
#   2) kubectl -n hlvm-system rollout status deploy/hlvm-crd-conversion
#   3) kubectl apply -f config/hardening/03c-nodevg-dual-version.yaml
#
# 回退：重新 apply config/crd/bases/storage.example.io_nodevgs.yaml 即可恢复单版本 v1beta1
# bootstrap baseline（该动作会移除 conversion 配置与 v1alpha1，v1beta1 数据不受影响）。
#
# 版本与字段：
#   v1alpha1 —— served + **非 storage**（老客户端兼容层；读写它会经 conversion 转到 v1beta1）
#   v1beta1  —— served + **storage**（控制器 / dashboard / agent 走它，读写存储版本不经 webhook）
#
# 爆炸半径：控制器走 v1beta1 存储版本，因此 webhook 挂掉**不影响控制器**；
# 受影响的只有显式使用 v1alpha1 的老客户端。这正是「迁消费者到存储版本」的意义——把
# conversion 从控制面的关键路径上摘下来。
#
# 字段差异：本轮 v1beta1 与 v1alpha1 **逐字段恒等**（仅建立版本化机制，schema 未变）；
# v1beta1 作为存储版本承担未来演进。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodevgs.storage.example.io
  annotations:
    # cert-manager cainjector 会把 Certificate 的 CA 注入 .spec.conversion.webhook.clientConfig.caBundle。
    # 没有这个注解就必须手工维护 caBundle，轮换时会静默失效（`x509: certificate signed by unknown authority`）。
    cert-manager.io/inject-ca-from: hlvm-system/hlvm-crd-conversion-serving-cert
spec:
  group: storage.example.io
  names:
    kind: NodeVG
    listKind: NodeVGList
    plural: nodevgs
    singular: nodevg
  scope: Cluster
  conversion:
    strategy: Webhook
    webhook:
      # apiserver 按 v1 协议发 ConversionReview；v1beta1 是当前唯一支持的 review 版本。
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: hlvm-system
          name: hlvm-crd-conversion
          path: /convert
          port: 443
  versions:
    - name: v1alpha1
      served: true
      storage: false
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: CapacityStatus
          type: string
          jsonPath: .status.capacityStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [nodeName]
              properties:
                nodeName: { type: string }
                tier: { type: string }
                deviceClassName: { type: string }
                layout:
                  type: string
                  enum: [pooled, per-disk]
                redundancy:
                  type: string
                  enum: [none, hw-raid, md-raid1, lvm-raid1]
                disks:
                  type: array
                  items: { type: string }
                thinPool:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    initialSizePercent: { type: integer }
                    maxSizePercent: { type: integer }
                    metadataSize: { type: string }
                    chunkSize: { type: string }
                    overprovisionRatio: { type: number }
                operations:
                  type: object
                  properties:
                    removeDisks:
                      type: array
                      items: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: CapacityStatus
          type: string
          jsonPath: .status.capacityStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [nodeName]
              properties:
                nodeName: { type: string }
                tier: { type: string }
                deviceClassName: { type: string }
                layout:
                  type: string
                  enum: [pooled, per-disk]
                redundancy:
                  type: string
                  enum: [none, hw-raid, md-raid1, lvm-raid1]
                disks:
                  type: array
                  items: { type: string }
                thinPool:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    initialSizePercent: { type: integer }
                    maxSizePercent: { type: integer }
                    metadataSize: { type: string }
                    chunkSize: { type: string }
                    overprovisionRatio: { type: number }
                operations:
                  type: object
                  properties:
                    removeDisks:
                      type: array
                      items: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
