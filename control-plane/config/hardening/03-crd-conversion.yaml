# CRD 多版本化与 conversion webhook 框架（设计 §11 升级：v1alpha1→v1beta1 带 conversion）。
#
# 本文件是**框架骨架**：声明 NodeDisk CRD 同时提供 v1alpha1（当前存储版本）与 v1beta1
# （占位、待实现字段变更）两个版本，conversion 策略指向一个 conversion webhook。
# 注意：v1beta1 的 schema 与 conversion 逻辑需随实际字段演进补全；在 conversion 逻辑
# 就绪前，请勿将 v1beta1 设为 stored，否则会破坏既有对象持久化。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodedisks.storage.example.io
spec:
  group: storage.example.io
  names:
    kind: NodeDisk
    listKind: NodeDiskList
    plural: nodedisks
    singular: nodedisk
  # 当前仅 v1alpha1 为存储版本；引入 v1beta1 并实现 conversion 后再切换 storedVersions。
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true          # 唯一存储版本
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true   # 占位：复用既有 API 结构，迁移时收紧
      subresources:
        status: {}
    - name: v1beta1
      served: true
      storage: false         # 非存储版本，必须经 conversion webhook 转换
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true   # 待实现：v1beta1 字段演进
      subresources:
        status: {}
  # conversion 交由专用 webhook；caBundle 由 cert-manager 或手动注入后替换占位。
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: hlvm-system
          name: hlvm-crd-conversion
          path: /convert
        # caBundle: <base64-DER-of-conversion-webhook-CA>  # 部署时注入
      conversionReviewVersions: ["v1"]
---
# conversion webhook 服务与部署骨架（stub）。实际需实现 /convert 端点，按
# apiserver 的 ConversionRequest 在各版本间无损转换（v1alpha1↔v1beta1）。
apiVersion: v1
kind: Service
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
spec:
  selector:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
  ports:
    - port: 443
      targetPort: 9444
      name: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: crd-conversion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: crd-conversion
    spec:
      serviceAccountName: hlvm-crd-conversion
      containers:
        - name: conversion
          image: ghcr.io/f31/hlvm/crd-conversion:latest
          args: ["--port=9444", "--cert-dir=/tmp/serving-certs"]
          ports:
            - containerPort: 9444
              name: https
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: serving-certs
              mountPath: /tmp/serving-certs
              readOnly: true
      volumes:
        - name: serving-certs
          secret:
            secretName: hlvm-crd-conversion-serving-cert
            defaultMode: 420
