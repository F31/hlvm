# CRD 多版本化与 conversion webhook（设计 §11 升级：v1alpha1→v1beta1 带 conversion）。
#
# 本文件是**可部署清单**（2026-10-30 由骨架转为实现，见 openspec add-hardening-rollout 3.1b）。
# 对应的服务端实现在 control-plane/cmd/crd-conversion，镜像 ghcr.io/f31/hlvm/crd-conversion。
#
# ============================== 应用顺序很重要 ==============================
# 1) 先 apply 本文件的**前半部分**（ServiceAccount / Issuer / Certificate / Service / Deployment），
#    等 Deployment Available 且 secret `hlvm-crd-conversion-serving-cert` 就绪；
# 2) 再 apply config/hardening/03b-nodedisk-dual-version.yaml —— 它开启 v1alpha1 兼容层与
#    conversion webhook，并保持 v1beta1 为存储版本。顺序反了会造成一个窗口：CRD 已要求
#    转换、但 webhook 还不存在 ⇒ 老客户端 v1alpha1 的读写失败（v1beta1 存储版本读写不经
#    webhook，不受影响）。
# 脚本化执行见 `scripts/m15-integration.sh verify-conversion`。
#
# ================================ 爆炸半径 ================================
# 收敛后 v1beta1 是**存储版本**，控制器 / dashboard / agent 都走 v1beta1——读写存储版本
# **不经过** conversion webhook，因此 webhook 挂掉不影响控制面。conversion webhook 只服务
# 显式使用 v1alpha1 兼容层的老客户端：webhook 不可用时，v1alpha1 的读写才会失败。
# 这是「迁消费者到存储版本」的收益：把 conversion 从控制面关键路径上摘下来，爆炸半径
# 从「v1beta1 客户端」收敛为「仅 v1alpha1 老客户端」（见 03b-nodedisk-dual-version.yaml）。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
---
# ============================== 证书链：固定根 CA ==============================
# 这里刻意**不**让 selfSigned Issuer 直接签 serving 证书。selfSigned 签出来的证书自己就是
# 根，serving 证书一重建，校验链的根就换了，而 CRD 上的 caBundle 靠 cainjector 异步重注入
# ——中间有真实不可用窗口（2026-10-30 实测：8–45 次调用连续失败、服务端持续
# `tls: bad certificate`，Pod 却全程 Ready）。改成「固定根 CA + 短期 serving 证书」后，
# serving 证书重建不改变校验链，caBundle 无需重注入（实测 sha 不变、openssl verify 通过）。
# 与本文件自带的 CA 是独立的：不复用 storage-webhook 那套，两份清单都能单独 apply。
#
# 进程侧的证书热加载由 certwatcher 负责（监听 tls.crt/tls.key 变化，无需重启，
# 见 cmd/crd-conversion），与 CA 稳定性是两件事。
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hlvm-crd-conversion-selfsigned
  namespace: hlvm-system
spec:
  selfSigned: {}
---
# 根 CA：10 年有效期 + 私钥不轮换。轮换它需要人工迁移 caBundle，属独立运维动作。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hlvm-crd-conversion-ca
  namespace: hlvm-system
spec:
  isCA: true
  commonName: hlvm-crd-conversion-ca
  secretName: hlvm-crd-conversion-ca
  duration: 87600h
  issuerRef:
    name: hlvm-crd-conversion-selfsigned
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hlvm-crd-conversion-ca-issuer
  namespace: hlvm-system
spec:
  ca:
    secretName: hlvm-crd-conversion-ca
---
# serving 证书：由上面的 CA 签发。secret 里的 ca.crt 由 cainjector 注入 CRD 的 caBundle。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hlvm-crd-conversion-serving-cert
  namespace: hlvm-system
spec:
  secretName: hlvm-crd-conversion-serving-cert
  dnsNames:
    - hlvm-crd-conversion.hlvm-system.svc
    - hlvm-crd-conversion.hlvm-system.svc.cluster.local
  issuerRef:
    name: hlvm-crd-conversion-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
spec:
  selector:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
  ports:
    - port: 443
      targetPort: 9444
      protocol: TCP
      name: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
spec:
  # 转换是同步调用，副本数 ≥2 才能滚动升级时不断读；单副本也能工作（会短暂不可用）。
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: crd-conversion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: crd-conversion
    spec:
      serviceAccountName: hlvm-crd-conversion
      # 只读根 + 非 root + 丢弃全部 capability：本服务不访问宿主机、不访问 apiserver。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: conversion
          image: ghcr.io/f31/hlvm/crd-conversion:latest
          imagePullPolicy: IfNotPresent
          args:
            - --port=9444
            - --health-addr=:9445
            - --cert-dir=/tmp/serving-certs
          ports:
            - containerPort: 9444
              name: https
            - containerPort: 9445
              name: health
          # 探针走明文端口：不受证书轮换/过期影响（证书坏了也不该让 Pod 反复重启）。
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: serving-certs
              mountPath: /tmp/serving-certs
              readOnly: true
      volumes:
        - name: serving-certs
          secret:
            secretName: hlvm-crd-conversion-serving-cert
            defaultMode: 420
