# CRD 多版本化与 conversion webhook（设计 §11 升级：v1alpha1→v1beta1 带 conversion）。
#
# 本文件是**可部署清单**（2026-10-30 由骨架转为实现，见 openspec add-hardening-rollout 3.1b）。
# 对应的服务端实现在 control-plane/cmd/crd-conversion，镜像 ghcr.io/f31/hlvm/crd-conversion。
#
# ============================== 应用顺序很重要 ==============================
# 1) 先 apply 本文件的**前半部分**（ServiceAccount / Issuer / Certificate / Service / Deployment），
#    等 Deployment Available 且 secret `hlvm-crd-conversion-serving-cert` 就绪；
# 2) 再 apply config/hardening/03b-nodedisk-dual-version.yaml —— 它会同时开启 v1beta1 与 conversion webhook。
#    顺序反了会造成一个窗口：CRD 已要求转换、但 webhook 还不存在 ⇒ 所有 NodeDisk
#    读写失败（`failed calling webhook`）。
# 脚本化执行见 `scripts/m15-integration.sh verify-conversion`。
#
# ================================ 爆炸半径 ================================
# conversion webhook 是 CRD 的**读路径依赖**：webhook 不可用时，v1beta1 的任何读写都会
# 失败（v1alpha1 是存储版本且本例中不跨版本，读路径仍**不经过** webhook，故控制器不受影响）。
# 这是刻意选择：v1beta1 先以 served+非存储版本上线，把风险限制在"用 v1beta1 的客户端"，
# 待稳定后再切 storedVersions（切存储需要独立的迁移步骤，见 runbook）。
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
---
# 与 storage-webhook 共用同一个自签名 Issuer（已存在则忽略 already exists）。
# 若集群已有集群级 Issuer/ClusterIssuer，把下面 Certificate 的 issuerRef 换成它并可删掉本段。
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: hlvm-selfsigned-issuer
  namespace: hlvm-system
spec:
  selfSigned: {}
---
# 证书轮换：cert-manager 默认在到期前 2/3 生命周期时续签，更新同名 secret；
# 进程侧由 certwatcher 监听 tls.crt/tls.key 变化热加载，无需重启（见 cmd/crd-conversion）。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hlvm-crd-conversion-serving-cert
  namespace: hlvm-system
spec:
  secretName: hlvm-crd-conversion-serving-cert
  dnsNames:
    - hlvm-crd-conversion.hlvm-system.svc
    - hlvm-crd-conversion.hlvm-system.svc.cluster.local
  issuerRef:
    name: hlvm-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Service
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
spec:
  selector:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
  ports:
    - port: 443
      targetPort: 9444
      protocol: TCP
      name: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlvm-crd-conversion
  namespace: hlvm-system
  labels:
    app.kubernetes.io/name: hlvm
    app.kubernetes.io/component: crd-conversion
spec:
  # 转换是同步调用，副本数 ≥2 才能滚动升级时不断读；单副本也能工作（会短暂不可用）。
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hlvm
      app.kubernetes.io/component: crd-conversion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hlvm
        app.kubernetes.io/component: crd-conversion
    spec:
      serviceAccountName: hlvm-crd-conversion
      # 只读根 + 非 root + 丢弃全部 capability：本服务不访问宿主机、不访问 apiserver。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: conversion
          image: ghcr.io/f31/hlvm/crd-conversion:latest
          imagePullPolicy: IfNotPresent
          args:
            - --port=9444
            - --health-addr=:9445
            - --cert-dir=/tmp/serving-certs
          ports:
            - containerPort: 9444
              name: https
            - containerPort: 9445
              name: health
          # 探针走明文端口：不受证书轮换/过期影响（证书坏了也不该让 Pod 反复重启）。
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: serving-certs
              mountPath: /tmp/serving-certs
              readOnly: true
      volumes:
        - name: serving-certs
          secret:
            secretName: hlvm-crd-conversion-serving-cert
            defaultMode: 420
