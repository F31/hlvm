apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hlvm-storage-controller
rules:
  - apiGroups: ["storage.example.io"]
    resources:
      - nodedisks
      - nodedisks/status
      - nodevgs
      - nodevgs/status
      - storagetasks
      - storagetasks/status
      - storagenodeops
      - storagenodeops/status
      - thinpoolpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 联动 Node 与容量数据源（设计 §2.1 / §4）。
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # 控制器缓存与业务读取：PV/PVC（删盘保护、孤儿回收）、ConfigMap（lvmd 配置）、Pod（调度约束）、Namespace。
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "configmaps", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  # LvmdConfigReconciler 渲染并写入 lvmd 配置 ConfigMap；
  # 节点无可服务 device-class 时删除托管 ConfigMap（lvmd 拒绝空 device-classes）。
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]
  # 容量控制器给节点打/摘 locked 标签（见 capacity_controller.applyLockLabel）。
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  # leader election 与事件。
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hlvm-storage-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hlvm-storage-controller
subjects:
  - kind: ServiceAccount
    name: hlvm-storage-controller
    namespace: hlvm-system
