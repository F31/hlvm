# 节点 Agent 的最小权限（设计 §2 最小权限修正 + 单写者原则）。
# Agent 是 StorageTask 的执行者与状态写回者；按 M14b（§3.1/§3.2）的观测写回拆分：
#   - Agent 写 NodeDisk 的【观测字段】（phase/health/occupiedBy/isSystemDisk）经 /status 子资源；
#   - 控制面 storage-controller 写 NodeDisk 的【任务结果字段】（identity/vgRef/raid/smart 等）。
# 二者作用于不同字段，避免双写冲突；StorageTask.status 的唯一写者仍是 Agent。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hlvm-agent
  # 必须与 agent/config/daemonset-agent.yaml 的 metadata.namespace 一致。
  # 早期手工 chaos 实验（v2-chaos-kind.yaml）把 Agent 跑在 kube-system，SA 随之建在那里；
  # 而正式 DaemonSet 部署在 hlvm-system。二者错配时 Pod 无法创建
  # （`serviceaccount "hlvm-agent" not found`），且因 Agent 从未进入 m15 集成脚本而长期未暴露。
  namespace: hlvm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hlvm-agent
rules:
  # 读取被纳管磁盘 / 卷组的声明（只读 spec/status，用于渲染任务与上报）。
  - apiGroups: ["storage.example.io"]
    resources: ["nodedisks", "nodevgs"]
    verbs: ["get", "list", "watch"]
  # Agent 写回 NodeDisk 观测字段（phase/health/occupiedBy/isSystemDisk）经 /status 子资源。
  - apiGroups: ["storage.example.io"]
    resources: ["nodedisks/status"]
    verbs: ["get", "update", "patch"]
  # 领取并写回节点任务状态（唯一写路径）。
  - apiGroups: ["storage.example.io"]
    resources: ["storagetasks"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["storage.example.io"]
    resources: ["storagetasks/status"]
    verbs: ["get", "update", "patch"]
  # 读取节点信息用于调度约束联动。
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hlvm-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hlvm-agent
subjects:
  - kind: ServiceAccount
    name: hlvm-agent
    namespace: hlvm-system
